<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tarjetas de Samantha · Panel privado</title>
<style>body{font:17px system-ui;background:#fff7fb;color:#64364e;margin:0}main{max-width:1050px;margin:auto;padding:25px}h1{color:#a5386c}input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid #dcb5c9}button{cursor:pointer;background:#fff}button:disabled{opacity:.5}#lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}article{background:white;border:1px solid #edcadb;border-radius:18px;padding:18px}img{width:100%;height:230px;object-fit:contain;background:#faf5f8;border-radius:12px}p{white-space:pre-wrap;overflow-wrap:anywhere}.acciones{display:flex;gap:7px;flex-wrap:wrap}.aprobar{background:#e1f4e5}#clave{max-width:100%;box-sizing:border-box}#estado{min-height:25px}</style></head>
<body><main><h1>🌸 Tarjetas de Samantha</h1><p>Panel privado para revisar las fotos y los mensajes de los niños.</p>
<form id="acceso"><label for="clave">Clave del panel (ADMIN_TOKEN)</label><br><input id="clave" type="password" autocomplete="off" required><button>Entrar</button></form>
<div id="controles" hidden><button id="actualizar">Actualizar</button> <button id="salir">Cerrar sesión</button></div>
<p id="estado" role="status"></p><section id="lista"></section></main>
<script>
const API='https://samantha-api.jcseba2010.workers.dev';let token='';
const estado=document.getElementById('estado'),lista=document.getElementById('lista');
async function api(path,body){const r=await fetch(API+path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+token,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined,signal:AbortSignal.timeout(30000)});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.mensaje||'No se pudo completar la solicitud.');return d;}
function cerrar(){token='';lista.replaceChildren();document.getElementById('acceso').hidden=false;document.getElementById('controles').hidden=true;estado.textContent='Sesión cerrada.';}
async function cargar(){estado.textContent='Cargando tarjetas…';try{const d=await api('/admin/recuerdos');lista.replaceChildren();for(const t of d.recuerdos){const card=document.createElement('article');const img=document.createElement('img');img.loading='lazy';try{const u=new URL(t.foto_url);if(u.protocol==='https:'&&u.hostname==='res.cloudinary.com')img.src=u.href;}catch{}img.alt='Foto del recuerdo';const titulo=document.createElement('h2');titulo.textContent=t.nombre_nino;const edad=document.createElement('p');edad.textContent=t.edad_texto;const mensaje=document.createElement('p');mensaje.textContent=t.mensaje;const status=document.createElement('p');status.textContent='Estado: '+t.estado;const acciones=document.createElement('div');acciones.className='acciones';for(const [valor,label] of [['APROBADO','Aprobar y publicar'],['RECHAZADO','Rechazar'],['PENDIENTE','Ocultar']]){const b=document.createElement('button');b.textContent=label;if(valor==='APROBADO')b.className='aprobar';b.onclick=async()=>{const botones=[...card.querySelectorAll('button')];botones.forEach(e=>e.disabled=true);try{await api('/admin/recuerdos/estado',{id:t.id,estado:valor});await cargar();}catch(e){estado.textContent=e.message;botones.forEach(e=>e.disabled=false);}};acciones.appendChild(b);}card.append(img,titulo,edad,mensaje,status,acciones);lista.appendChild(card);}document.getElementById('acceso').hidden=true;document.getElementById('controles').hidden=false;estado.textContent=d.recuerdos.length+' tarjeta(s). Solo las aprobadas aparecen en la página.';}catch(e){estado.textContent=e.message;}}
document.getElementById('acceso').onsubmit=async e=>{e.preventDefault();token=document.getElementById('clave').value;document.getElementById('clave').value='';await cargar();};document.getElementById('actualizar').onclick=cargar;document.getElementById('salir').onclick=cerrar;
</script></body></html>
